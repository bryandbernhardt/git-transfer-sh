name: ShellSpec

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellSpec
        run: |
          curl -fsSL https://git.io/shellspec | sh -s 0.28.1 -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ShellSpec tests
        run: shellspec
